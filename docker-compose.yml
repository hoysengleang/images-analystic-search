# Values below fall back to sane defaults, so `docker compose up` works with
# no .env file. Compose reads .env automatically when you do create one.
services:
  api:
    build: .
    container_name: openvisionsearch-api
    environment:
      APP_NAME: ${APP_NAME:-OpenVisionSearch}
      APP_ENV: ${APP_ENV:-development}
      APP_DATA_DIR: /data/state
      API_PREFIX: ${API_PREFIX:-}
      API_KEY: ${API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["*"]}

      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Merchant originals are read-only; application state uses its own volume.
      ALLOWED_IMAGE_ROOT: /data/images
      COLLECTION_METADATA_PATH: /data/state/collections.json

      DEFAULT_EMBEDDING_PROVIDER: ${DEFAULT_EMBEDDING_PROVIDER:-openclip}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-ViT-B-32}
      DEFAULT_MODEL_PRETRAINED: ${DEFAULT_MODEL_PRETRAINED:-laion2b_s34b_b79k}
      DEFAULT_VECTOR_SIZE: ${DEFAULT_VECTOR_SIZE:-512}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
      IMAGE_FRAMING: ${IMAGE_FRAMING:-pad}
      EMBED_VIEWS: ${EMBED_VIEWS:-1}
      WARMUP_MODEL_ON_STARTUP: ${WARMUP_MODEL_ON_STARTUP:-true}

      MAX_IMAGE_SIZE_MB: ${MAX_IMAGE_SIZE_MB:-20}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-25}
      URL_DOWNLOAD_TIMEOUT_SECONDS: ${URL_DOWNLOAD_TIMEOUT_SECONDS:-10}
      MAX_REDIRECTS: ${MAX_REDIRECTS:-3}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}

      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-10}
      MAX_TOP_K: ${MAX_TOP_K:-100}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Originals are input-only; the service never needs permission to alter them.
      - ./data/images:/data/images:ro
      # Mutable application state is isolated from the image mount.
      - app_state:/data/state
      # Keeps downloaded model weights across rebuilds.
      - model_cache:/opt/model-cache
    depends_on:
      qdrant:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qdrant:
    # Pin releases so upgrades are deliberate and reproducible.
    image: qdrant/qdrant:v1.19.0
    container_name: openvisionsearch-qdrant
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  app_state:
  qdrant_storage:
  model_cache:
