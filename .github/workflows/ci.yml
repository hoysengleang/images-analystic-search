name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU inference runtime
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.python-version }}" == "3.9" ]]; then
            python -m pip install \
              "torch==2.7.1+cpu" "torchvision==0.22.1" \
              --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install \
              "torch==2.13.0+cpu" "torchvision==0.28.0+cpu" \
              --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Lint
        run: ruff check app tests examples benchmarks scripts

      - name: Check formatting
        run: ruff format --check app tests examples benchmarks scripts

      - name: Test
        run: python -m pytest -q
