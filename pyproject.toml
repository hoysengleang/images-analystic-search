[project]
name = "openvisionsearch"
version = "0.1.0"
description = "Self-hosted visual search API built on FastAPI, OpenCLIP, and Qdrant."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds a real model architecture; skip with -m 'not slow'",
]
filterwarnings = ["ignore::urllib3.exceptions.NotOpenSSLWarning"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "B008",   # FastAPI puts Depends()/File() calls in argument defaults by design.
    "UP007",  # Optional[X] stays: Pydantic cannot resolve `X | None` on Python 3.9.
    "UP045",  # Same reason as UP007.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"benchmarks/*" = ["E501"]
