[project]
name = "openvisionsearch"
version = "0.1.0"
description = "Free, self-hosted visual product search with interchangeable engines."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/hoysengleang/images-analystic-search"
Documentation = "https://github.com/hoysengleang/images-analystic-search/tree/main/docs"
Issues = "https://github.com/hoysengleang/images-analystic-search/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds a real model architecture; skip with -m 'not slow'",
]
filterwarnings = ["ignore::urllib3.exceptions.NotOpenSSLWarning"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C90",  # keep individual functions understandable
]
ignore = [
    "B008",   # FastAPI puts Depends()/File() calls in argument defaults by design.
    "UP007",  # Optional[X] stays: Pydantic cannot resolve `X | None` on Python 3.9.
    "UP045",  # Same reason as UP007.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]
"benchmarks/*" = ["E501"]
